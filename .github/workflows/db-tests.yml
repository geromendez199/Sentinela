name: Database and RLS tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start Supabase
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset --no-seed

      - name: Apply seed
        run: supabase db reset

      - name: RLS and SQL tests
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop
